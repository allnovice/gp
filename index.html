<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Tracking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

header {
    padding: 10px;
    background: #222;
    color: white;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

#deviceList {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.device-button {
    background: transparent;
    color: white;
    border: none;
    padding: 8px;
    margin: 0;
    cursor: pointer;
    font-size: 14px;
}

.device-button:hover {
    text-decoration: underline;
}

#gpsControls {
    display: flex;
    align-items: center;
    gap: 8px;
}

#toggleGPS {
    margin: 0;
}

#status {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: red;
}

#map {
    height: calc(100vh - 65px);
}
</style>
</head>
<body>
<header>
    <div id="deviceList"></div>

    <div id="gpsControls">
        <button id="resetView" onclick="resetMapView()" title="Reset map view">
            ↻
        </button>

        <div id="status"></div>
        <button id="toggleGPS" onclick="toggleGPS()">Start GPS</button>
    </div>
</header>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const defaultMapPosition = [14.5995, 120.9842];
const defaultZoom = 13;

const savedMapView = JSON.parse(
    localStorage.getItem('gpsMapView') || 'null'
);

const map = L.map('map').setView(
    savedMapView?.center || defaultMapPosition,
    savedMapView?.zoom || defaultZoom
);

map.on('moveend', () => {
    const center = map.getCenter();

    localStorage.setItem('gpsMapView', JSON.stringify({
        center: [center.lat, center.lng],
        zoom: map.getZoom()
    }));
});

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; OpenStreetMap'
}).addTo(map);

let deviceId = localStorage.getItem('gpsDeviceId');
if (!deviceId) {
  deviceId = 'Phone-' + Math.random().toString(36).slice(2,8);
  localStorage.setItem('gpsDeviceId',deviceId);
}

const markers = {};
let watchId = null;

const pinColors = JSON.parse(
    localStorage.getItem('gpsPinColors') || '{}'
);

const defaultPinColor = 'blue';

function getPinIcon(color) {
    return L.icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });
}

function getDevicePinColor(id) {
    return pinColors[id] || defaultPinColor;
}

function setGpsStatus(active) {
    document.getElementById('status').style.background =
        active ? 'green' : 'red';
}

function resetMapView() {
    map.setView(defaultMapPosition, defaultZoom);

    localStorage.removeItem('gpsMapView');
}

function toggleGPS() {
    if (watchId !== null) {
        stopGPS();
    } else {
        startGPS();
    }
}
let mapInitialized = false;
async function refreshLocations() {
  try {
    const res = await fetch('/locations');
    const locations = await res.json();

    for (const id of Object.keys(markers)) {
      if (!locations[id]) {
        map.removeLayer(markers[id]);
        delete markers[id];
      }
    }

    for (const [id,loc] of Object.entries(locations)) {
      if (!Number.isFinite(loc.lat) || !Number.isFinite(loc.lon)) continue;

const pinIcon = getPinIcon(getDevicePinColor(id));

if (!markers[id]) {
    markers[id] = L.marker([loc.lat, loc.lon], {
        icon: pinIcon
    })
        .addTo(map)
        .bindPopup(id);
} else {
    markers[id].setLatLng([loc.lat, loc.lon]);
    markers[id].setIcon(pinIcon);
}

    }
    renderDeviceList(locations);
  } catch(e) {
  }
}

function renderDeviceList(locations) {
    const deviceList = document.getElementById('deviceList');
    deviceList.innerHTML = '';

    for (const id of Object.keys(locations)) {
        if (!markers[id]) continue;

        const container = document.createElement('div');
        container.style.display = 'flex';
        container.style.alignItems = 'center';

        const nameButton = document.createElement('button');
        nameButton.className = 'device-button';
        nameButton.textContent = id;

        nameButton.onclick = () => {
            map.setView(markers[id].getLatLng(), 16);
            markers[id].openPopup();
        };

        const pinButton = document.createElement('button');
        pinButton.textContent = '📍';
        pinButton.style.background = 'transparent';
        pinButton.style.border = 'none';
        pinButton.style.padding = '4px';
        pinButton.style.margin = '0';
        pinButton.style.cursor = 'pointer';
        pinButton.style.color = getDevicePinColor(id);

        pinButton.onclick = () => {
            const colors = [
                'blue', 'red', 'green', 'orange',
                'yellow', 'violet', 'grey', 'black'
            ];

            const currentColor = getDevicePinColor(id);
            const nextColor = colors[
                (colors.indexOf(currentColor) + 1) % colors.length
            ];

            pinColors[id] = nextColor;

            localStorage.setItem(
                'gpsPinColors',
                JSON.stringify(pinColors)
            );

            markers[id].setIcon(getPinIcon(nextColor));
            pinButton.style.color = nextColor;
        };

        container.appendChild(nameButton);
        container.appendChild(pinButton);
        deviceList.appendChild(container);
    }
}

function startGPS() {
  if (watchId !== null) return;
localStorage.setItem('gpsTracking', 'on');
  if (!navigator.geolocation) {
    setGpsStatus(false)	;
    return;
  }

document.getElementById('toggleGPS').textContent = 'Stop GPS';
  watchId = navigator.geolocation.watchPosition(async p => {
    setGpsStatus(true);
    const loc = {
      id:deviceId,
      lat:p.coords.latitude,
      lon:p.coords.longitude
    };

    try {
      const res = await fetch('/locations',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(loc)
      });
      if (!res.ok) throw new Error('Upload failed');

if (!mapInitialized) {
    map.setView([loc.lat,loc.lon],16);
    mapInitialized = true;
}
      await refreshLocations();
    } catch(e) {
        console.error('Send error:', e);
    }
  },e => {
    setGpsStatus(false);
    stopGPS();
  },{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
}

async function stopGPS() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
  }
  watchId = null;
  setGpsStatus(false);
document.getElementById('toggleGPS').textContent = 'Start GPS';
localStorage.setItem('gpsTracking', 'off');

  try {
    await fetch('/locations/' + encodeURIComponent(deviceId), {
      method:'DELETE'
    });
    await refreshLocations();
  } catch(e) {
      console.error('Could not clear server pin:', e);
  }
}

refreshLocations();

if (localStorage.getItem('gpsTracking') === 'on') {
  startGPS();
}
setInterval(refreshLocations,5000);
</script>
</body>
</html>
